<!-- helps browsers display webpages correctly -->
<!DOCTYPE html>
<!-- html doc beginning -->
<html lang="en">
<!-- initiates container for data abt data (metadata) -->
<head>
<!-- defines metadata -->
    <meta charset="UTF-8">
<!-- sets viewport so it looks good on all websites -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- doc's title,seen in title bar OR tab  -->
    <title>Flexbox Navigation Bar</title>
<!-- defines relationship between doc and external source -->
    <link rel="stylesheet" href="style.css">
<!-- ends off header -->
</head>
<!-- defines body,(start point of all content)  -->
<body>

<!--initiates the class under navbar/nav defines set of navigation links-->
    <nav class="navbar">
<!--Inititates class under logo (a and applies all the code under that class to be shown),  adds "MyBrand" text -->
        <div class="logo">MyBrand</div>
<!-- defines an unordered list, iniciates class under nav links -->
        <ul class="nav-links">
<!-- defines list item, defines hyperlink, specififys url of page directed by link, adds "Home" closes hyperlink definition, closes list item  -->
            <li><a href="#home">Home</a></li>
<!--  defines list item,defines hyperlink,specififys url of page directed by link, adds "About" closes hyperlink definition, closes list item -->
            <li><a href="#about">About</a></li>
<!-- defines list item, defines hyperlink,specififys url of page directed by link, adds "services" closes hyperlink definition, closes list item -->
            <li><a href="#services">Services</a></li>
<!-- defines list item, defines hyperlink,specififys url of page directed by link, adds "portfolio" closes hyperlink definition, closes list item -->
            <li><a href="#portfolio">Portfolio</a></li>
<!--defines list item, defines hyperlink,specififys url of page directed by link, adds "contact" closes hyperlink definition, closes list item  -->
            <li><a href="#contact">Contact</a></li>
<!-- defines end of unordered list {finisher} -->
        </ul>
<!-- ends iniciation of class under navbar -->
    </nav>
<!-- ends body/content -->
</body>
<!-- ends html page  -->
</html>
